name: '${pluginName}'
version: '${version}'
main: org.yuemi.mmoitems.plugin.MmoItemsPlugin
api-version: '${apiVersion}'
authors: [${authors}]
contributors: [${contributors}']

dependencies:
  server:
    YueMiLibs:
      load: BEFORE
      required: true
      join-classpath: false
    MmoMechanics:
      load: BEFORE
      required: true
      join-classpath: false
    PlaceholderAPI:
      load: AFTER
      required: false
      join-classpath: false
